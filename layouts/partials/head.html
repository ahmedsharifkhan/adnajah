{{ partial "tracking/gtm-head.html" . }}

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>{{ .Title }} | {{ .Site.Title }}</title>

<!-- Favicons -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ "assets/images/favicons/apple-touch-ad-najah.png" | relURL }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "assets/images/favicons/photoshop favicon 32 x 32.png" | relURL }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ "assets/images/favicons/photo shop 16 x 16.png" | relURL }}">
<link rel="manifest" href="{{ "assets/images/favicons/site.webmanifest" | relURL }}">

<meta name="description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}Ad Najah is a results-driven digital marketing agency in Dhaka, Bangladesh — Meta Ads, Google Ads, Social Media Marketing &amp; Creative Design.{{ end }}" />

<!-- DNS Prefetch -->
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="dns-prefetch" href="https://www.googletagmanager.com">

<!-- Preconnect for fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Preload LCP hero background image -->
<link rel="preload" href="{{ "assets/images/backgrounds/slider-1-1.png" | relURL }}" as="image" fetchpriority="high">

<!-- ═══════════════════════════════════════════
     CRITICAL CSS — loaded synchronously
     (bootstrap layout + main template styles)
════════════════════════════════════════════ -->
<link rel="stylesheet" href="{{ "assets/vendors/bootstrap/css/bootstrap.min.css" | relURL }}">
<link rel="stylesheet" href="{{ "assets/css/growim.css" | relURL }}">

     NON-CRITICAL CSS — loaded asynchronously

════════════════════════════════════════════ -->

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"></noscript>
